<script>
  const rulebookContent = document.getElementById("rulebook-content");

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
  }

  function inlineMarkdown(value) {
    return escapeHtml(value)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  function renderMarkdown(markdown) {
    const lines = markdown.replace(/\r/g, "").split("\n");
    const output = [];
    let paragraph = [];
    let listType = null;

    const flushParagraph = () => {
      if (paragraph.length) {
        output.push(`<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`);
        paragraph = [];
      }
    };
    const closeList = () => {
      if (listType) {
        output.push(`</${listType}>`);
        listType = null;
      }
    };

    for (let index = 0; index < lines.length; index += 1) {
      const line = lines[index];
      const trimmed = line.trim();
      if (!trimmed) {
        flushParagraph();
        closeList();
        continue;
      }

      if (/^\|.*\|$/.test(trimmed)) {
        flushParagraph();
        closeList();
        const rows = [];
        while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
          const cells = lines[index].trim().slice(1, -1).split("|").map((cell) => cell.trim());
          if (!cells.every((cell) => /^:?-{3,}:?$/.test(cell))) rows.push(cells);
          index += 1;
        }
        index -= 1;
        if (rows.length) {
          const [headers, ...body] = rows;
          output.push(`<div class="rulebook-table-wrap"><table><thead><tr>${headers.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${body.map((row) => `<tr>${headers.map((_, cellIndex) => `<td>${inlineMarkdown(row[cellIndex] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        }
        continue;
      }

      const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
      if (heading) {
        flushParagraph();
        closeList();
        const level = heading[1].length;
        output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
        continue;
      }
      if (/^(---+|\*\*\*+|___+)$/.test(trimmed)) {
        flushParagraph();
        closeList();
        output.push("<hr>");
        continue;
      }
      const listItem = trimmed.match(/^([-*]|\d+\.)\s+(.+)$/);
      if (listItem) {
        flushParagraph();
        const nextType = /^\d/.test(listItem[1]) ? "ol" : "ul";
        if (listType !== nextType) {
          closeList();
          output.push(`<${nextType}>`);
          listType = nextType;
        }
        output.push(`<li>${inlineMarkdown(listItem[2])}</li>`);
        continue;
      }
      closeList();
      paragraph.push(trimmed);
    }
    flushParagraph();
    closeList();
    return output.join("\n");
  }

  fetch("3회치킨게임_규정집.md")
    .then((response) => {
      if (!response.ok) throw new Error("규정집 파일을 불러오지 못했습니다.");
      return response.text();
    })
    .then((markdown) => {
      rulebookContent.innerHTML = renderMarkdown(markdown);
      rulebookContent.classList.add("rulebook-loaded");
    })
    .catch(() => {
      rulebookContent.innerHTML = '<p class="rulebook-error">규정집을 불러오지 못했습니다. 페이지를 웹 서버에서 열고 다시 시도해 주세요.</p>';
    });
</script>
