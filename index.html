<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>치킨게임 기록실 | CHICKEN GAME ARCHIVE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 상단 네비게이션 -->
<header class="top-nav">
  <a href="#" class="logo">
    <img
      src="assets/img/chicken-logo.png"
      alt="치킨게임 로고"
      class="logo-icon"
    />

    <span class="logo-text">
      <span>CHICKEN GAME</span>
      <strong>ARCHIVE</strong>
    </span>
  </a>

  <nav class="nav-menu">
    <a href="#" class="active">홈</a>
    <a href="#">대회 정보</a>
    <a href="#">역대 기록</a>
    <a href="#">참가자</a>
    <a href="#">명예의 전당</a>
  </nav>

  <button class="search-button" aria-label="검색">
    <span></span>
  </button>
</header>

<main>
  <section class="hero">

    <div class="hero-character">
      <img
        src="assets/img/chicken-banner.png"
        alt="치킨게임 마스코트"
      />
    </div>

    <div class="hero-title">
      <p class="hero-subtitle">
        OVERWATCH STREAMER TOURNAMENT
      </p>

      <h1>
        <span class="title-chicken">치킨게임</span>
        <span class="title-record">기록실</span>
      </h1>

      <p class="hero-english">
        CHICKEN GAME ARCHIVE
      </p>
    </div>

    <div class="hero-message">
      <img
        src="assets/img/hand-style-text.png"
        alt="치킨으로 증명하는 스트리머 옵치 대회"
      />
    </div>

  </section>

  <section class="quick-menu">

    <a href="#" class="quick-card">
      <img
        src="assets/img/quick-menu-button.png"
        alt=""
        class="quick-card-bg"
      />

      <div class="quick-content">
        <span class="quick-icon">🏆</span>
        <span class="quick-text">역대 우승팀</span>
        <span class="quick-arrow">›</span>
      </div>
    </a>

    <a href="#" class="quick-card">
      <img
        src="assets/img/quick-menu-button.png"
        alt=""
        class="quick-card-bg"
      />

      <div class="quick-content">
        <span class="quick-icon">📋</span>
        <span class="quick-text">대회 기록</span>
        <span class="quick-arrow">›</span>
      </div>
    </a>

    <a href="#" class="quick-card">
      <img
        src="assets/img/quick-menu-button.png"
        alt=""
        class="quick-card-bg"
      />

      <div class="quick-content">
        <span class="quick-icon">👥</span>
        <span class="quick-text">역대 참가자</span>
        <span class="quick-arrow">›</span>
      </div>
    </a>

    <a href="#" class="quick-card">
      <img
        src="assets/img/quick-menu-button.png"
        alt=""
        class="quick-card-bg"
      />

      <div class="quick-content">
        <span class="quick-icon">👑</span>
        <span class="quick-text">명예의 전당</span>
        <span class="quick-arrow">›</span>
      </div>
    </a>

  </section>
</main>

</body>
</html>
